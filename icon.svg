<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1a1a2e"/>
  <!-- Left wall -->
  <rect x="40" y="40" width="30" height="432" rx="4" fill="#16213e"/>
  <!-- Right wall -->
  <rect x="442" y="40" width="30" height="432" rx="4" fill="#16213e"/>
  <!-- Spikes on right -->
  <polygon points="442,100 410,130 442,160" fill="#e94560"/>
  <polygon points="442,180 410,210 442,240" fill="#e94560"/>
  <polygon points="442,340 410,370 442,400" fill="#e94560"/>
  <!-- Spikes on left -->
  <polygon points="70,140 102,170 70,200" fill="#e94560"/>
  <polygon points="70,300 102,330 70,360" fill="#e94560"/>
  <!-- Bird body -->
  <circle cx="256" cy="280" r="40" fill="#f1c40f"/>
  <!-- Beak -->
  <polygon points="296,272 320,280 296,288" fill="#e67e22"/>
  <!-- Eye white -->
  <circle cx="270" cy="272" r="12" fill="white"/>
  <!-- Eye pupil -->
  <circle cx="274" cy="272" r="7" fill="#2d2d2d"/>
  <!-- Eye highlight -->
  <circle cx="276" cy="269" r="3" fill="white"/>
  <!-- Bot indicator -->
  <circle cx="256" cy="450" r="12" fill="#53d8fb" opacity="0.8"/>
  <text x="256" y="490" text-anchor="middle" fill="#53d8fb" font-family="sans-serif" font-size="24" font-weight="bold">BOT</text>
</svg>
