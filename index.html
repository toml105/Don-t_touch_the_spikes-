<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f7f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cloudline Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: Swiss grid. Paper-white blocks pinned to a 16px gutter, one grotesk
   in many widths, hairline rules, a single red accent; the 3D sky does the colour. */
:root {
  --paper: #f7f7f4;
  --paper-2: #ebebe6;
  --ink: #111111;
  --gray: #74746f;
  --rule: rgba(17, 17, 17, 0.16);
  --red: #e3241b;
  --red-ink: #ffffff;
  --g: 16px;
  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font); font-weight: 500; font-stretch: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
.label::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--red); margin-right: 6px; vertical-align: 0; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--g) 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.block { pointer-events: auto; background: var(--paper); color: var(--ink); padding: 8px 12px 9px; min-width: 0; }
#coinPill { min-width: 132px; }
#coins { display: block; font-size: 34px; line-height: 0.95; font-weight: 800; font-stretch: 78%; letter-spacing: -0.01em; margin-top: 4px; }
#rate { display: block; font-size: 11px; color: var(--gray); font-weight: 700; margin-top: 3px; letter-spacing: 0.04em; }
.right { display: flex; gap: 6px; align-items: stretch; }
#record { text-align: left; }
#recordVal { display: block; font-size: 22px; line-height: 1; font-weight: 800; font-stretch: 78%; margin-top: 5px; }
#muteBtn { pointer-events: auto; background: var(--ink); color: var(--paper); border: 0; width: 40px; display: grid; place-items: center; }
#muteBtn svg { width: 18px; height: 18px; }
#coinPill.pulse { animation: pulse .22s ease-out; }
@keyframes pulse { 50% { background: var(--red); color: var(--red-ink); } }

/* ---------- Run overlay ---------- */
#runhud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 96px); left: var(--g); right: 64px; z-index: 4; pointer-events: none; color: #fff; }
#depth { font-size: 104px; line-height: 0.82; font-weight: 900; font-stretch: 70%; letter-spacing: -0.03em; text-shadow: 0 2px 18px rgba(0,0,0,.28); }
#depth small { font-size: 22px; font-weight: 800; font-stretch: 100%; letter-spacing: 0.1em; margin-left: 6px; }
#runmeta { margin-top: 10px; display: inline-flex; background: var(--ink); color: var(--paper); }
.chip { padding: 6px 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.chip + .chip { border-left: 1px solid rgba(255,255,255,.25); }
#hint { margin-top: 10px; font-size: 13px; font-weight: 700; max-width: 240px; line-height: 1.3; text-shadow: 0 1px 8px rgba(0,0,0,.45); }

#meter { position: fixed; right: var(--g); top: 26%; bottom: 26%; width: 30px; z-index: 4; pointer-events: none; }
#meter::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.25); }
#meter .band { position: absolute; right: 4px; width: 5px; }
#meter .tick { position: absolute; right: 0; width: 10px; height: 1px; background: #fff; }
#meter .mark { position: absolute; right: -2px; width: 22px; height: 3px; background: var(--red); transform: translateY(-1px); }
#meter .mark::after { content: ""; position: absolute; left: -7px; top: -4px; border: 5px solid transparent; border-right: 7px solid var(--red); border-left: 0; }
#meter .max { position: absolute; right: 0; width: 16px; height: 2px; background: var(--ink); }

#biomeToast {
  position: fixed; left: var(--g); right: var(--g); top: 44%; z-index: 6; pointer-events: none; color: #fff;
  opacity: 0; transform: translateX(-12px); transition: opacity .4s, transform .4s;
  font-size: 52px; line-height: 0.9; font-weight: 900; font-stretch: 72%; letter-spacing: -0.02em; text-transform: uppercase; text-shadow: 0 2px 22px rgba(0,0,0,.35);
}
#biomeToast span { display: block; font-size: 12px; font-weight: 800; font-stretch: 100%; letter-spacing: 0.16em; margin-bottom: 8px; color: #fff; }
#biomeToast span b { background: var(--red); padding: 2px 6px; margin-right: 6px; font-weight: 800; }
#biomeToast.show { opacity: 1; transform: none; }

/* ---------- Dock ---------- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 0 var(--g) calc(env(safe-area-inset-bottom, 0px) + var(--g));
  display: grid; grid-template-columns: 1fr 1fr 1.7fr 1fr 1fr; gap: 6px; align-items: stretch;
}
.tab {
  position: relative; background: var(--paper); border: 0; padding: 10px 8px 9px; min-width: 0; height: 72px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left;
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
}
.tab svg { width: 22px; height: 22px; }
.tab:active, .tab.on { background: var(--ink); color: var(--paper); }
.tab .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--red); }
#castBtn {
  background: var(--red); color: var(--red-ink); border: 0; height: 72px; padding: 9px 10px; position: relative;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left;
}
#castBtn span { font-size: 34px; line-height: 0.85; font-weight: 900; font-stretch: 72%; letter-spacing: -0.01em; text-transform: uppercase; }
#castBtn small { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
#castBtn::after { content: "↓"; position: absolute; right: 10px; top: 6px; font-size: 26px; font-weight: 700; }
#castBtn:active { background: var(--ink); }
@media (prefers-reduced-motion: no-preference) { #castBtn::after { animation: drop 1.6s ease-in-out infinite; } }
@keyframes drop { 50% { transform: translateY(6px); } }

/* ---------- Sheet ---------- */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 70%;
  background: var(--paper); color: var(--ink); border-top: 4px solid var(--ink);
  /* the shadow also stops Chrome treating this opaque sheet as hiding the whole 3D canvas */
  box-shadow: 0 -10px 30px rgba(17, 17, 17, 0.18);
  padding: 14px var(--g) calc(env(safe-area-inset-bottom, 0px) + var(--g));
  display: flex; flex-direction: column; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
}
#sheet.open { transform: none; }
#sheet .grab { display: none; }
#sheet header { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
#sheet h2 { margin: 0; font-size: 44px; line-height: 0.85; font-weight: 900; font-stretch: 72%; letter-spacing: -0.02em; text-transform: uppercase; }
#sheet header p { margin: 8px 0 0; font-size: 12px; color: var(--gray); font-weight: 600; max-width: 32ch; line-height: 1.35; }
#sheetClose { background: var(--ink); color: var(--paper); border: 0; width: 40px; height: 40px; font-size: 18px; font-weight: 700; }
#sheetBody { overflow-y: auto; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }

.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.row .ico { font-size: 13px; font-weight: 900; color: var(--red); align-self: start; padding-top: 2px; font-variant-numeric: tabular-nums; }
.row .ico img { width: 34px; height: 34px; object-fit: cover; display: block; }
.row h3 { margin: 0; font-size: 17px; line-height: 1.1; font-weight: 800; font-stretch: 88%; }
.row p { margin: 3px 0 0; font-size: 12px; color: var(--gray); font-weight: 500; line-height: 1.35; }
.row .lvl { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--ink); background: var(--paper-2); padding: 1px 5px; margin-left: 4px; vertical-align: 2px; font-stretch: 100%; }
.buy {
  border: 0; padding: 0 12px; height: 40px; min-width: 88px; background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: flex-end; gap: 7px; font-size: 14px; font-weight: 800;
}
.buy .coin { width: 8px; height: 8px; }
.buy:disabled { background: transparent; color: var(--gray); box-shadow: inset 0 0 0 1px var(--rule); cursor: default; }
.buy:disabled .coin { background: var(--gray); }
.buy.maxed { background: transparent; color: var(--gray); box-shadow: inset 0 0 0 1px var(--rule); }
.locked h3, .locked p { color: var(--gray); }
.coin { display: inline-block; width: 10px; height: 10px; background: var(--red); flex: none; }

.tiers { display: flex; align-items: center; gap: 3px; margin-top: 7px; flex-wrap: wrap; }
.tier { width: 16px; height: 6px; background: var(--paper-2); }
.tier.on { background: var(--c); }
.tier.cur { box-shadow: 0 0 0 1.5px var(--ink); }
.tiers em { font-style: normal; font-size: 10px; color: var(--gray); margin-left: 6px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }

.dexhead { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 14px 0 8px; border-bottom: 1px solid var(--ink); }
.dexhead b { color: var(--red); }
.dex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.dexcard { padding: 10px 8px 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.dexcard + .dexcard { padding-left: 8px; border-left: 1px solid var(--rule); }
.dexcard img { width: 100%; aspect-ratio: 1; object-fit: contain; max-width: 100%; background: var(--paper-2); display: block; }
.dexcard.unknown img { filter: brightness(0) opacity(.18); }
.dexcard b { display: block; font-size: 13px; line-height: 1.15; font-weight: 800; margin-top: 7px; overflow-wrap: anywhere; font-stretch: 88%; }
.dexcard span { display: block; font-size: 10px; color: var(--gray); font-weight: 600; margin-top: 3px; line-height: 1.3; }
.dexcard.rare:not(.unknown) b::after { content: " ★"; color: var(--red); }
.note { margin: 12px 0 0; color: var(--gray); font-size: 11px; font-weight: 600; line-height: 1.4; }

/* ---------- Modal ---------- */
#modal { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; padding: var(--g); background: rgba(17,17,17,.35); }
.card { width: min(440px, 100%); justify-self: center; background: var(--paper); padding: 18px var(--g) var(--g); max-height: 88%; overflow-y: auto; border-top: 6px solid var(--red); }
.card h2 { margin: 0; font-size: 46px; line-height: 0.85; font-weight: 900; font-stretch: 70%; letter-spacing: -0.02em; text-transform: uppercase; }
.card .sub { margin: 10px 0 14px; color: var(--gray); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.haul { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); border-top: 1px solid var(--ink); margin-bottom: 4px; }
.haul div { position: relative; padding: 8px 6px 10px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.haul img { width: 100%; height: 58px; object-fit: contain; background: var(--paper-2); display: block; }
.haul b { display: block; font-size: 12px; font-weight: 800; margin-top: 6px; line-height: 1.15; font-stretch: 88%; }
.haul i { font-style: normal; font-size: 12px; font-weight: 800; color: var(--red); }
.haul .new { position: absolute; top: 12px; left: 4px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; padding: 2px 4px; }
.haul .rare b::after { content: " ★"; color: var(--red); }
.total { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 14px; font-size: 64px; line-height: 0.85; font-weight: 900; font-stretch: 70%; }
.total .coin { width: 16px; height: 16px; align-self: center; }
.big { width: 100%; border: 0; height: 56px; padding: 0 16px; background: var(--red); color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.big::after { content: "→"; font-size: 22px; }
.big:active { background: var(--ink); }
.bonusline { margin: 10px 0 0; font-size: 12px; font-weight: 700; }
.bonusline::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--red); margin-right: 8px; }
.haul .gold b { color: #a8740a; }
.haul .gold img { box-shadow: inset 0 -5px 0 #f3c046; }

/* ---------- Hook spin ---------- */
.spinbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding-top: 14px; }
.spinbtn { border: 0; height: 64px; padding: 8px 10px; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; min-width: 0; }
.spinbtn b { font-size: 20px; line-height: .9; font-weight: 900; font-stretch: 72%; text-transform: uppercase; }
.spinbtn span { font-size: 11px; font-weight: 800; letter-spacing: .06em; display: flex; align-items: center; gap: 5px; }
.spinbtn .coin { width: 8px; height: 8px; }
.spinbtn.red { background: var(--red); }
.spinbtn:disabled { background: transparent; color: var(--gray); box-shadow: inset 0 0 0 1px var(--rule); cursor: default; }
.spinbtn:disabled .coin { background: var(--gray); }
.rdot { display: inline-block; width: 7px; height: 7px; background: var(--rc); margin-right: 4px; }
.hooks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hookcell { position: relative; border: 0; background: none; text-align: left; padding: 10px 8px 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; display: flex; flex-direction: column; font: inherit; color: inherit; }
.hookcell:nth-child(3n+2), .hookcell:nth-child(3n) { padding-left: 8px; border-left: 1px solid var(--rule); }
.hookcell svg { width: 100%; aspect-ratio: 1; background: var(--paper-2); box-shadow: inset 0 -5px 0 var(--rc); display: block; padding: 12%; }
.hookcell b { font-size: 13px; line-height: 1.15; font-weight: 800; margin-top: 7px; font-stretch: 88%; }
.hookcell span { font-size: 10px; color: var(--gray); font-weight: 600; margin-top: 3px; line-height: 1.3; }
.hookcell .stars { color: var(--red); font-size: 11px; letter-spacing: 1px; }
.hookcell em { font-style: normal; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; color: var(--gray); }
.hookcell.on em { color: var(--paper); background: var(--ink); align-self: flex-start; padding: 2px 5px; }
.hookcell.unknown b { color: var(--gray); }
.reel { position: relative; overflow: hidden; height: 108px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 0 0 14px; }
.reel .strip { display: flex; height: 100%; will-change: transform; }
.reel .cell { width: 88px; flex: none; height: 100%; border-right: 1px solid var(--rule); display: grid; place-items: center; box-shadow: inset 0 -6px 0 var(--rc); }
.reel .cell svg { width: 58px; height: 70px; }
.reel .cell.win { background: var(--paper-2); }
.reel .pin { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--red); }
.reel .pin::before { content: ""; position: absolute; left: -6px; top: 0; border: 7px solid transparent; border-top: 9px solid var(--red); border-bottom: 0; }
.hookcard { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; align-items: start; margin-bottom: 14px; }
.hookcard svg { width: 104px; height: 104px; background: var(--paper-2); box-shadow: inset 0 -6px 0 var(--rc); padding: 14px; }
.hookcard .rar { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--rc); padding: 2px 6px; }
.hookcard h3 { margin: 6px 0 2px; font-size: 28px; line-height: .9; font-weight: 900; font-stretch: 72%; text-transform: uppercase; }
.hookcard .stars { color: var(--red); letter-spacing: 2px; font-size: 14px; }
.hookcard p { margin: 6px 0 0; font-size: 13px; font-weight: 700; line-height: 1.35; }
.hookcard .blurb { color: var(--gray); font-weight: 500; font-size: 12px; }
.ghost { width: 100%; border: 0; background: none; height: 44px; margin-top: 4px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gray); text-align: left; }

/* ---------- Loader / toasts ---------- */
#loader { position: fixed; inset: 0; z-index: 20; background: var(--paper); transition: opacity .6s; display: grid; grid-template-rows: 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) var(--g) calc(env(safe-area-inset-bottom, 0px) + 28px); overflow: hidden; }
#loader .sun { position: absolute; width: 78vw; max-width: 420px; aspect-ratio: 1; border-radius: 50%; background: var(--red); right: -18vw; top: 9%; }
#loader h1 { position: relative; align-self: end; margin: 0; font-size: clamp(64px, 22vw, 150px); line-height: 0.8; font-weight: 900; font-stretch: 62%; letter-spacing: -0.03em; text-transform: uppercase; }
#loader .meta { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 2px solid var(--ink); margin-top: 18px; padding-top: 8px; }
#loader .meta div { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3; }
#loader .meta b { display: block; font-size: 26px; font-stretch: 75%; letter-spacing: -0.01em; }
#loader .bar { position: relative; height: 4px; background: var(--paper-2); margin-top: 18px; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
#loader p { position: relative; margin: 8px 0 0; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); }
#toasts { position: fixed; left: var(--g); right: var(--g); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 9; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 4px; pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: 9px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; animation: toast 2.6s forwards; max-width: 100%; }
.toast::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--red); margin-right: 8px; }
.toast.gold { background: var(--red); }
.toast.gold::before { background: #fff; }
@keyframes toast { 0% { opacity: 0; transform: translateX(-10px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.pop { position: fixed; z-index: 7; pointer-events: none; font-size: 30px; font-weight: 900; font-stretch: 72%; color: var(--red); background: var(--paper); padding: 2px 8px; animation: pop 1.1s forwards; transform: translate(-50%, -50%); }
@keyframes pop { to { opacity: 0; transform: translate(-50%, -150%); } }
.flycoin { position: fixed; z-index: 11; width: 12px; height: 12px; margin: -6px 0 0 -6px; pointer-events: none; background: var(--red); box-shadow: 0 0 0 2px #fff; }
@media (prefers-reduced-motion: reduce) { .toast, .pop { animation-duration: .01s; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="block" id="coinPill" aria-live="polite">
    <div class="label">Coins</div>
    <span id="coins" class="num">0</span>
    <span id="rate" class="num">+0 / sec</span>
  </div>
  <div class="right">
    <div class="block" id="record"><div class="label">Record</div><b class="num" id="recordVal">0 m</b></div>
    <button id="muteBtn" aria-label="Toggle sound"></button>
  </div>
</div>

<div id="runhud" hidden>
  <div id="depth" class="num">0<small>m</small></div>
  <div id="runmeta"><span class="chip num" id="haulChip">0 / 3</span><span class="chip num" id="shieldChip" hidden></span></div>
  <div id="hint">Drag to steer. Dodge on the way down.</div>
</div>
<div id="meter" hidden></div>
<div id="biomeToast"></div>

<div id="dock">
  <button class="tab" data-panel="gear" aria-label="Gear upgrades">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M12 2v10"/><path d="M12 12a4 4 0 1 0 4 4"/></svg>
    Gear<span class="dot" hidden></span>
  </button>
  <button class="tab" data-panel="train" aria-label="Train carriages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><rect x="3" y="5" width="18" height="11"/><path d="M3 10h18"/><path d="M7 20h0M17 20h0" stroke-width="4"/></svg>
    Train<span class="dot" hidden></span>
  </button>
  <button id="castBtn"><span>Cast</span><small id="castDepth" class="num">30 m line</small></button>
  <button class="tab" data-panel="dex" aria-label="Skydex collection">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7" fill="currentColor"/></svg>
    Skydex
  </button>
  <button class="tab" data-panel="spin" aria-label="Hook spin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
    Spin<span class="dot" hidden></span>
  </button>
</div>

<section id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <header><div><h2 id="sheetTitle">Gear</h2><p id="sheetSub"></p></div><button id="sheetClose" aria-label="Close">✕</button></header>
  <div id="sheetBody"></div>
</section>

<div id="modal" hidden></div>
<div id="toasts"></div>

<div id="loader">
  <div class="sun"></div>
  <h1>Cloud&shy;line<br>Ex&shy;press</h1>
  <div>
    <div class="meta">
      <div><b>05</b>Sky layers</div>
      <div><b>15</b>Species</div>
      <div><b>1,320</b>Metres deep</div>
    </div>
    <div class="bar"><i id="loadBar"></i></div>
    <p id="loadText">Loading the sky</p>
  </div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
