<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16133a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cloudline Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-bleed 3D sky with a brass-and-glass HUD floating on top; panels rise as bottom sheets. */
:root {
  --night: #16133a;
  --glass: rgba(22, 19, 58, 0.74);
  --glass-hi: rgba(255, 244, 226, 0.08);
  --line: rgba(243, 196, 107, 0.35);
  --brass: #f3c46b;
  --brass-deep: #b9822f;
  --cream: #fff4e2;
  --muted: #b9b3dc;
  --coral: #ff8c7a;
  --teal: #63e2d3;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--cream); font-family: var(--font-body); font-weight: 800; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.num { font-variant-numeric: tabular-nums; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.pill {
  pointer-events: auto; background: var(--glass); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px 6px 8px; display: flex; align-items: center; gap: 8px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.coin {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--brass) 45%, var(--brass-deep));
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
}
#coins { font-family: var(--font-display); font-size: 22px; letter-spacing: .5px; }
#rate { font-size: 12px; color: var(--muted); }
.stack { display: flex; flex-direction: column; line-height: 1.05; }
#record { font-size: 12px; color: var(--muted); text-align: right; padding: 8px 12px; }
#record b { display: block; color: var(--cream); font-family: var(--font-display); font-weight: 400; font-size: 18px; }

/* ---------- Run overlay ---------- */
#runhud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 0; right: 0; z-index: 4; text-align: center; pointer-events: none; }
#depth { font-family: var(--font-display); font-size: 56px; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.25), 0 0 24px rgba(0,0,0,.35); }
#depth small { font-size: 24px; opacity: .8; }
#runmeta { margin-top: 6px; display: inline-flex; gap: 8px; }
.chip { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
#hint { margin-top: 10px; font-size: 14px; color: var(--cream); opacity: .9; text-shadow: 0 1px 6px rgba(0,0,0,.5); }

#meter { position: fixed; right: 10px; top: 30%; bottom: 30%; width: 8px; border-radius: 8px; overflow: hidden; z-index: 4; background: rgba(0,0,0,.25); }
#meter .band { position: absolute; left: 0; right: 0; }
#meter .mark { position: absolute; left: -4px; right: -4px; height: 3px; background: var(--cream); border-radius: 3px; box-shadow: 0 0 8px var(--cream); }
#meter .max { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--coral); }

#biomeToast {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.9); z-index: 6;
  font-family: var(--font-display); font-size: 34px; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .5s, transform .5s; text-shadow: 0 4px 24px rgba(0,0,0,.5);
}
#biomeToast span { display: block; font-family: var(--font-body); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--brass); }
#biomeToast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------- Dock ---------- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px;
}
.tab {
  background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 10px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; min-width: 0;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: relative;
}
.tab svg { width: 26px; height: 26px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab .dot { position: absolute; top: 6px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 8px var(--coral); }
#castBtn {
  width: 112px; height: 112px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 40% 30%, #ffe6a8, var(--brass) 50%, var(--brass-deep));
  box-shadow: 0 0 0 5px rgba(255,244,226,.18), 0 10px 30px rgba(0,0,0,.4), inset 0 -6px 0 rgba(0,0,0,.18);
  color: #3b2508; font-family: var(--font-display); font-size: 26px; letter-spacing: .5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
#castBtn small { font-family: var(--font-body); font-size: 11px; font-weight: 900; opacity: .7; margin-top: 4px; }
#castBtn:active { transform: scale(.96); }
@media (prefers-reduced-motion: no-preference) { #castBtn { animation: breathe 2.4s ease-in-out infinite; } }
@keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(255,244,226,.08), 0 10px 30px rgba(0,0,0,.4), inset 0 -6px 0 rgba(0,0,0,.18); } }

/* ---------- Sheet ---------- */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 72%;
  background: linear-gradient(180deg, rgba(34,29,82,.96), rgba(18,15,46,.98));
  border-top: 1px solid var(--line); border-radius: 26px 26px 0 0;
  padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; flex-direction: column; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.9,.3,1);
  box-shadow: 0 -20px 50px rgba(0,0,0,.4);
}
#sheet.open { transform: none; }
#sheet .grab { width: 44px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.25); margin: 0 auto 8px; }
#sheet header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
#sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
#sheet header p { margin: 0; font-size: 12px; color: var(--muted); }
#sheetClose { background: var(--glass-hi); border: 0; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; flex: none; }
#sheetBody { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }

.row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
  background: var(--glass-hi); border: 1px solid rgba(255,255,255,.06); border-radius: 18px; padding: 10px 10px 10px 10px;
}
.row .ico { width: 52px; height: 52px; border-radius: 14px; background: rgba(0,0,0,.25); display: grid; place-items: center; overflow: hidden; }
.row .ico img { width: 100%; height: 100%; object-fit: contain; }
.row .ico svg { width: 30px; height: 30px; }
.row h3 { margin: 0; font-size: 16px; font-weight: 900; }
.row p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.row .lvl { color: var(--brass); font-size: 12px; }
.buy {
  border: 0; border-radius: 14px; padding: 10px 12px; min-width: 92px;
  background: linear-gradient(180deg, var(--brass), var(--brass-deep)); color: #3b2508; font-weight: 900;
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;
}
.buy .coin { width: 16px; height: 16px; }
.buy:disabled { filter: grayscale(.9) brightness(.6); cursor: default; }
.buy.maxed { background: var(--glass-hi); color: var(--muted); }
.locked { opacity: .55; }

.dex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dexcard { background: var(--glass-hi); border-radius: 16px; padding: 8px; text-align: center; border: 1px solid rgba(255,255,255,.06); min-width: 0; }
.dexcard img { width: 100%; aspect-ratio: 1; object-fit: contain; max-width: 100%; }
.dexcard.unknown img { filter: brightness(0) opacity(.45); }
.dexcard b { display: block; font-size: 12px; line-height: 1.2; overflow-wrap: anywhere; }
.dexcard span { font-size: 11px; color: var(--muted); font-weight: 600; }
.dexhead { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--brass); margin: 6px 2px 0; }

/* ---------- Modal ---------- */
#modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(8,6,24,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.card {
  width: min(420px, 100%); background: linear-gradient(180deg, #2a2468, #17133f); border: 1px solid var(--line);
  border-radius: 26px; padding: 22px 18px 18px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5);
  max-height: 90%; overflow-y: auto;
}
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0 0 4px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; font-weight: 600; }
.haul { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 14px; }
.haul div { background: var(--glass-hi); border-radius: 14px; padding: 6px 4px; position: relative; min-width: 0; }
.haul img { width: 100%; height: 56px; object-fit: contain; }
.haul b { display: block; font-size: 12px; }
.haul i { font-style: normal; font-size: 11px; color: var(--brass); }
.haul .new { position: absolute; top: -6px; right: -4px; background: var(--coral); color: #3a0f08; font-size: 10px; border-radius: 999px; padding: 2px 6px; }
.total { font-family: var(--font-display); font-size: 40px; color: var(--brass); margin: 4px 0 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.total .coin { width: 34px; height: 34px; }
.big {
  width: 100%; border: 0; border-radius: 18px; padding: 16px; font-family: var(--font-display); font-size: 22px;
  background: linear-gradient(180deg, var(--brass), var(--brass-deep)); color: #3b2508;
}
.bonusline { font-size: 13px; color: var(--teal); margin: -6px 0 12px; }

/* ---------- Loader / toasts ---------- */
#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, #3b2f7a, var(--night)); transition: opacity .6s; }
#loader h1 { font-family: var(--font-display); font-weight: 400; font-size: 44px; margin: 0; text-align: center; line-height: .95; }
#loader h1 span { display: block; font-size: 18px; color: var(--brass); letter-spacing: 6px; text-transform: uppercase; font-family: var(--font-body); font-weight: 900; margin-bottom: 8px; }
#loader .bar { width: 200px; max-width: 70vw; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); margin: 22px auto 0; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .2s; }
#loader p { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; font-weight: 600; }
#toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 9; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: toast 2.6s forwards; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
.pop { position: fixed; z-index: 7; pointer-events: none; font-family: var(--font-display); font-size: 22px; color: var(--brass); text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: pop 1s forwards; transform: translate(-50%, -50%); }
@keyframes pop { to { opacity: 0; transform: translate(-50%, -160%); } }
.toast.gold { background: linear-gradient(180deg, rgba(243,196,107,.95), rgba(185,130,47,.95)); color: #3b2508; border-color: rgba(255,244,226,.5); font-weight: 900; }
.flycoin { position: fixed; z-index: 11; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--brass) 45%, var(--brass-deep)); box-shadow: 0 0 12px rgba(243,196,107,.8); }
#coinPill.pulse { animation: pulse .25s ease-out; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.tiers { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.tier { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
.tier.on { background: radial-gradient(circle at 35% 30%, #fff, var(--c) 55%); border-color: transparent; box-shadow: 0 0 8px var(--c); }
.tier.cur { outline: 2px solid var(--cream); outline-offset: 1px; }
.tiers em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 700; }
.haul .rare, .dexcard.rare:not(.unknown) { background: linear-gradient(180deg, rgba(243,196,107,.25), rgba(243,196,107,.06)); box-shadow: inset 0 0 0 1px rgba(243,196,107,.5); }
.note { margin: 2px 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
#muteBtn { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; }
#muteBtn svg { width: 18px; height: 18px; }
.right { display: flex; gap: 8px; align-items: flex-start; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="pill" id="coinPill" aria-live="polite">
    <div class="coin" aria-hidden="true"></div>
    <div class="stack"><span id="coins" class="num">0</span><span id="rate" class="num">+0 / sec</span></div>
  </div>
  <div class="right">
    <div class="pill" id="record" style="display:block">Deepest<b class="num" id="recordVal">0 m</b></div>
    <button id="muteBtn" aria-label="Toggle sound"></button>
  </div>
</div>

<div id="runhud" hidden>
  <div id="depth" class="num">0<small> m</small></div>
  <div id="runmeta"><span class="chip num" id="haulChip">0 / 3</span><span class="chip num" id="shieldChip" hidden></span></div>
  <div id="hint">Drag to steer. Dodge on the way down.</div>
</div>
<div id="meter" hidden></div>
<div id="biomeToast"></div>

<div id="dock">
  <div class="tabs">
    <button class="tab" data-panel="gear" aria-label="Gear upgrades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v9"/><path d="M12 11a4 4 0 1 0 4 4"/><path d="M16 15l-2-2"/></svg>
      Gear<span class="dot" hidden></span>
    </button>
    <button class="tab" data-panel="train" aria-label="Train carriages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="3"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>
      Train<span class="dot" hidden></span>
    </button>
  </div>
  <button id="castBtn"><span>Cast</span><small id="castDepth" class="num">30 m line</small></button>
  <div class="tabs">
    <button class="tab" data-panel="dex" aria-label="Skydex collection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h5"/></svg>
      Skydex
    </button>
    <button class="tab" data-panel="map" aria-label="Sky map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7l4-4 4 4"/><path d="M5 12h14"/><path d="M7 17h10"/></svg>
      Layers
    </button>
  </div>
</div>

<section id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <header><div><h2 id="sheetTitle">Gear</h2><p id="sheetSub"></p></div><button id="sheetClose" aria-label="Close">✕</button></header>
  <div id="sheetBody"></div>
</section>

<div id="modal" hidden></div>
<div id="toasts"></div>

<div id="loader">
  <div>
    <h1><span>All aboard the</span>Cloudline<br>Express</h1>
    <div class="bar"><i id="loadBar"></i></div>
    <p id="loadText">Painting the sky…</p>
  </div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
